<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acesso | AI Usage Monitor</title>

  <link rel="icon" href="/assets/inteligencia-artificial.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card glass-card">
      <div class="brand">
        <span class="brand-mark">AI</span>
        AI Usage Monitor
      </div>

      <div class="auth-heading">
        <span class="eyebrow">Área restrita</span>
        <h1>Acesso ao sistema</h1>

        <p>
          Entre com um e-mail previamente autorizado para registrar
          relatórios de uso de inteligência artificial.
        </p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field-group">
          <label for="email">E-mail autorizado</label>
          <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary-button" type="submit" id="loginButton">
          <span>Entrar no sistema</span>
          <span class="button-arrow">→</span>
        </button>

        <div id="loginMessage" class="form-message"></div>
      </form>

      <div class="auth-footer">
        <span class="status-dot"></span>
        Sistema protegido por autenticação Supabase
        <span class="status-dot"></span>
        Desenvolvido por Caio Belmont
      </div>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
